name: Deploy to GitHub Pages

# Deploy on every landing to main. Both triggers are intentional:
# - push: direct commits and most merges
# - pull_request_target closed+merged: covers merges where the push
#   event is delayed or dropped (seen with rapid/API merges). Using
#   pull_request_target (not pull_request) so the run is on the base
#   branch and satisfies the github-pages environment branch policy.
on:
  push:
    branches: [main]
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only the newest deploy matters for Pages; drop superseded runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # On merge events, deploy the merge commit already on main —
          # never the untrusted PR head (pull_request_target safety).
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
